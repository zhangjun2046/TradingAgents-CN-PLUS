<!DOCTYPE html>

  <h2>Logo v1 — 等宽 H（<code>icons/hunteragent-v1.svg</code>）</h2>
  <div class="row">
    <figure>
      <svg class="logo" width="64" height="64" viewBox="0 0 64 64" fill="none">
        <rect width="64" height="64" rx="12" fill="#409EFF"/>
        <path d="M16 16H24V28H40V16H48V48H40V36H24V48H16Z" fill="white"/>
      </svg>
      <figcaption>64px</figcaption>
    </figure>

    </figure>
