<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PWA图标生成工具</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    h1 {
      color: #409EFF;
      margin-bottom: 10px;
    }
    .description {
      color: #666;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    canvas {
      border: 2px solid #ddd;
      border-radius: 8px;
      margin: 20px 0;
      display: block;
    }
    button {
      background: #409EFF;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      margin: 10px 10px 10px 0;
      transition: background 0.3s;
    }
    button:hover {
      background: #3a8ee6;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .icon-preview {
      display: flex;
      gap: 20px;
      margin: 20px 0;
      flex-wrap: wrap;
    }
    .preview-item {
      text-align: center;
    }
    .preview-item img {
      border: 2px solid #ddd;
      border-radius: 8px;
      background: #f9f9f9;
    }
    .preview-label {
      margin-top: 8px;
      color: #666;
      font-size: 14px;
    }
    .success {
      background: #67C23A;
      color: white;
      padding: 12px;
      border-radius: 6px;
      margin: 10px 0;
      display: none;
    }
    .instructions {
      background: #E6F7FF;
      border-left: 4px solid #409EFF;
      padding: 15px;
      margin: 20px 0;
      border-radius: 4px;
    }
    .instructions h3 {
      margin-top: 0;
      color: #409EFF;
    }
    .instructions ol {
      margin: 10px 0;
      padding-left: 20px;
    }
    .instructions li {
      margin: 8px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎨 PWA图标生成工具</h1>
    <p class="description">
      此工具将从 logo.svg 生成 PWA 所需的多尺寸图标文件。
    </p>

    <div class="instructions">
      <h3>📋 使用说明</h3>
      <ol>
        <li>点击下方按钮，将自动从 logo.svg 生成图标</li>
        <li>预览生成的图标效果</li>
        <li>点击下载按钮保存到 <code>frontend/public/</code> 目录</li>
        <li>确保生成以下文件：
          <ul>
            <li><strong>icon-192.png</strong> - 192x192 标准图标</li>
            <li><strong>icon-512.png</strong> - 512x512 高清图标</li>
            <li><strong>apple-touch-icon.png</strong> - 180x180 Apple专用图标</li>
          </ul>
        </li>
      </ol>
    </div>

    <button onclick="generateIcons()">🚀 生成PWA图标</button>
    
    <div class="success" id="successMsg">
      ✅ 图标生成成功！请点击下载按钮保存文件。
    </div>

    <div class="icon-preview" id="iconPreview"></div>

    <canvas id="canvas" style="display: none;"></canvas>
  </div>

  <script>
    async function generateIcons() {
      const sizes = [
        { size: 192, name: 'icon-192.png', label: '192x192 标准图标' },
        { size: 512, name: 'icon-512.png', label: '512x512 高清图标' },
        { size: 180, name: 'apple-touch-icon.png', label: '180x180 Apple图标' }
      ];

      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const preview = document.getElementById('iconPreview');
      preview.innerHTML = '';

      try {
        // 加载SVG
        const response = await fetch('/logo.svg');
        const svgText = await response.text();
        
        // 创建SVG图像
        const img = new Image();
        const svgBlob = new Blob([svgText], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(svgBlob);

        img.onload = function() {
          sizes.forEach(({ size, name, label }) => {
            // 设置canvas尺寸
            canvas.width = size;
            canvas.height = size;

            // 绘制白色背景
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, size, size);

            // 绘制SVG到canvas
            ctx.drawImage(img, 0, 0, size, size);

            // 转换为PNG
            canvas.toBlob(function(blob) {
              const imgUrl = URL.createObjectURL(blob);
              
              // 创建预览
              const previewItem = document.createElement('div');
              previewItem.className = 'preview-item';
              
              const previewImg = document.createElement('img');
              previewImg.src = imgUrl;
              previewImg.width = Math.min(size, 200);
              previewImg.height = Math.min(size, 200);
              
              const previewLabel = document.createElement('div');
              previewLabel.className = 'preview-label';
              previewLabel.textContent = label;
              
              const downloadBtn = document.createElement('button');
              downloadBtn.textContent = `下载 ${name}`;
              downloadBtn.onclick = function() {
                const a = document.createElement('a');
                a.href = imgUrl;
                a.download = name;
                a.click();
              };
              
              previewItem.appendChild(previewImg);
              previewItem.appendChild(previewLabel);
              previewItem.appendChild(downloadBtn);
              preview.appendChild(previewItem);
            }, 'image/png');
          });

          document.getElementById('successMsg').style.display = 'block';
          URL.revokeObjectURL(url);
        };

        img.onerror = function() {
          alert('❌ 加载 logo.svg 失败，请确保文件存在于 public 目录');
        };

        img.src = url;
      } catch (error) {
        console.error('生成图标失败:', error);
        alert('❌ 生成图标时出错: ' + error.message);
      }
    }

    // 页面加载完成后提示
    window.onload = function() {
      console.log('💡 PWA图标生成工具已就绪');
      console.log('📝 点击"生成PWA图标"按钮开始生成');
    };
  </script>
</body>
</html>
